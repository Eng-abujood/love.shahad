<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      color: #e0e0e0;
    }

    /* حاوية الوردة - تبدأ بألوان كاملة ثم تذبل */
    .flower-container {
      position: relative;
      width: 200px;
      height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* تحويل الألوان تدريجياً للرمادي */
      transition: filter 4s ease-in-out;
    }

    /* الساق */
    .stem {
      position: absolute;
      bottom: 0;
      width: 8px;
      height: 180px;
      background-color: #3e8e41;
      border-radius: 4px;
      transform-origin: bottom center;
      transition: transform 4s ease-in-out, background-color 4s ease-in-out;
    }

    /* الأوراق على الساق */
    .leaf-left, .leaf-right {
      position: absolute;
      width: 40px;
      height: 20px;
      background-color: #3e8e41;
      border-radius: 0 20px 0 20px;
      transition: transform 4s ease-in-out, background-color 4s ease-in-out;
    }

    .leaf-left {
      top: 60px;
      left: -35px;
      transform: rotate(-20deg);
    }

    .leaf-right {
      top: 90px;
      right: -35px;
      border-radius: 20px 0 20px 0;
      transform: rotate(20deg);
    }

    /* بتلات الوردة */
    .rose-head {
      position: absolute;
      top: 60px;
      width: 80px;
      height: 90px;
      transform-origin: bottom center;
      transition: transform 4s ease-in-out;
    }

    .petal {
      position: absolute;
      background-color: #e63946;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      transition: background-color 4s ease-in-out, transform 4s ease-in-out, opacity 4s ease-in-out;
    }

    .petal-center {
      width: 40px;
      height: 60px;
      top: 15px;
      left: 20px;
      background-color: #b71c1c;
      z-index: 3;
    }

    .petal-left {
      width: 50px;
      height: 70px;
      top: 10px;
      left: 5px;
      transform: rotate(-15deg);
      z-index: 2;
    }

    .petal-right {
      width: 50px;
      height: 70px;
      top: 10px;
      right: 5px;
      transform: rotate(15deg);
      z-index: 2;
    }

    /* بتلات خارجية قابلة للتساقط */
    .petal-falling-1, .petal-falling-2 {
      width: 35px;
      height: 45px;
      top: 25px;
      z-index: 1;
    }

    .petal-falling-1 {
      left: 0;
      transform: rotate(-35deg);
    }

    .petal-falling-2 {
      right: 0;
      transform: rotate(35deg);
    }

    /* -----------------------------------
       حالة الذبول (Withered State)
    ----------------------------------- */
    
    /* سحب الألوان بالكامل */
    .withered {
      filter: grayscale(100%) brightness(0.6);
    }

    /* انحناء الساق */
    .withered .stem {
      transform: rotate(-12deg);
      background-color: #555;
    }

    /* انحناء الرأس والأوراق */
    .withered .rose-head {
      transform: rotate(-25deg) translateY(10px);
    }

    .withered .leaf-left {
      transform: rotate(-55deg) translateY(10px);
      background-color: #444;
    }

    .withered .leaf-right {
      transform: rotate(55deg) translateY(10px);
      background-color: #444;
    }

    .withered .petal {
      background-color: #4a4a4a;
    }

    .withered .petal-center {
      background-color: #2b2b2b;
    }

    /* تساقط البتلة الأولى للمغسلة/الأرض */
    .withered .petal-falling-1 {
      animation: fall1 4s forwards ease-in-out;
    }

    /* تساقط البتلة الثانية */
    .withered .petal-falling-2 {
      animation: fall2 4.5s forwards ease-in-out 0.5s;
    }

    @keyframes fall1 {
      0% { transform: rotate(-35deg) translate(0, 0); }
      50% { transform: rotate(45deg) translate(-30px, 100px); }
      100% { transform: rotate(120deg) translate(-50px, 220px); opacity: 0.3; }
    }

    @keyframes fall2 {
      0% { transform: rotate(35deg) translate(0, 0); }
      50% { transform: rotate(-45deg) translate(30px, 120px); }
      100% { transform: rotate(-90deg) translate(40px, 220px); opacity: 0.2; }
    }

    /* النص التعبيري الهادئ */
    .message {
      margin-top: 40px;
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 1px;
      color: #888;
      opacity: 0;
      transition: opacity 3s ease-in-out 2.5s; /* يظهر ببطء أثناء تآكل الوردة */
      text-align: center;
      max-width: 80%;
      line-height: 1.6;
    }

    .message.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="flower-container" id="flower">
    <div class="rose-head">
      <div class="petal petal-center"></div>
      <div class="petal petal-left"></div>
      <div class="petal petal-right"></div>
      <div class="petal petal-falling-1"></div>
      <div class="petal petal-falling-2"></div>
    </div>
    <div class="stem">
      <div class="leaf-left"></div>
      <div class="leaf-right"></div>
    </div>
  </div>

  <p class="message" id="textMessage">
    بعض الأشياء تموت تدريجياً... عندما تُترك بلا عناية💔💔.
  </p>

  <script>
    // يبدأ التأثير بعد ثانيتين من فتح الصفحة
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        document.getElementById('flower').classList.add('withered');
        document.getElementById('textMessage').classList.add('show');
      }, 2000); 
    });
  </script>

</body>
</html>
